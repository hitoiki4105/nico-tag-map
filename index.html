<!DOCTYPE html>
<html lang="ja" id="htmlRoot">
<head>
<meta charset="UTF-8">
<title id="pageTitleTag">タグ探索マップ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="layoutGrid">

<div id="s11" class="gridSection">
  <div id="s11InnerWrap">
    <h1 id="pageTitle">タグ探索マップ</h1>
    <p id="toolTagline">ニコニコ動画の関連タグ検索ツール(非公式)</p>
    <p id="subtitle">タグは、動画の森で動画と出会うための道標のようです。</p>
    <p id="contactLine">問い合わせなどはこちらから <a href="https://x.com/hitoiki327882" target="_blank" rel="noopener">https://x.com/hitoiki327882</a></p>
    <div id="langBar">
      <label id="languageLabel">言語:</label>
      <select id="langSelect">
        <option value="ja">日本語</option>
        <option value="en">English</option>
        <option value="zh">中文</option>
        <option value="ko">한국어</option>
      </select>
    </div>
  </div>
</div>

<div id="s12" class="gridSection">
  <div id="mapImageSection">
    <img id="mapImage" src="https://github.com/hitoiki4105/nico-tag-map/blob/main/img_map.jpg?raw=true" alt="タグ探索マップ">
  </div>
</div>

<div id="s21" class="gridSection">
  <div id="firstTagSection" class="highlightBox">
    <div class="titleWithToggle">
      <h2 id="firstTagSectionTitle">中心タグの指定</h2>
      <button id="firstTagExplanationToggle" class="textToggleBtn"></button>
    </div>
    <div>
      <input id="tagInput" value="言葉">
    </div>
    <div id="firstTagExplanation" style="display:none;">
      <p id="firstTagLabel" class="sectionDescription"></p>
      <p id="firstTagInfo" class="sectionDescription"></p>
      <p id="firstTagFreqInfo" class="sectionDescription"></p>
    </div>
    <div id="periodSection" class="infoBox">
      <div>
      <p id="periodDescription" class="boxTitle" style="display:inline-block; margin-right:12px;">検索対象動画投稿期間（オプション）</p>
      <button id="clearPeriodBtn" class="secondaryBtn">期間を指定しない（デフォルトにリセットする）</button>
    </div>
      <span id="fromYearLabel">開始年:</span>
      <input id="fromYear" type="number" placeholder="例: 2018" style="width:80px" min="2006">
      <span id="toYearLabel">終了年:</span>
      <input id="toYear" type="number" placeholder="例: 2020" style="width:80px" min="2006">
    </div>
    <button id="searchBtn" style="display:block;">タグ探索マップを展開する</button>
  </div>
</div>

<div id="s22" class="gridSection">
  <div id="displayModeSection">
    <div id="displayModeBox" class="highlightBox">
      <div class="titleWithToggle">
        <h2 id="displayModeTitle">関連タグの表示範囲</h2>
        <button id="displayModeExplanationToggle" class="textToggleBtn"></button>
      </div>
      <div id="displayModeExplanation" style="display:none;">
        <p id="displayModeDescription2" class="sectionDescription"></p>
        <p id="displayModeDescription4" class="sectionDescription"></p>
      </div>
      <div id="displayModeControls">
        <label class="displayModeRow">
          <input type="radio" name="displayMode" value="topN" checked>
          <span id="topLabel">上位</span>
          <select id="topNSelect">
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="30" selected>30</option>
            <option value="40">40</option>
            <option value="50">50</option>
            <option value="60">60</option>
            <option value="70">70</option>
            <option value="80">80</option>
            <option value="90">90</option>
            <option value="100">100</option>
          </select>
        </label>
        <label class="displayModeRow">
          <input type="radio" name="displayMode" value="range">
          <input type="number" id="rangeFrom" value="0" min="0" max="90" step="10" style="width:85px"><span id="rangeFromLabel">位 から</span>
          <input type="number" id="rangeTo" value="10" min="10" step="10" style="width:85px"><span id="rangeToLabel">位 まで</span>
        </label>
        <p id="rangeNoteText" class="sectionDescription"></p>
      </div>
      <div id="applyDisplayBtnWrap"><button id="applyDisplayBtn">マップの表示を更新する</button></div>
    </div>
  </div>
</div>

<div id="sc" class="gridSection gridSectionFull">
  <div class="titleWithToggle">
    <h2 id="searchResultTitle">共起ネットワーク図</h2>
    <button id="legendExplanationToggle" class="textToggleBtn"></button>
  </div>
  <div id="legend" style="display:none;">
    <ul>
      <li id="legendNode"></li>
      <li id="legendEdge"></li>
      <li id="legendColor"></li>
    </ul>
  </div>
  <div id="mapStatusSection" class="infoBox">
    <p id="mapStatusTitle" class="boxTitle">タグ探索マップ展開状況</p>
    <div id="fairyAnimContainer">
      <img id="fairyImg" src="https://github.com/hitoiki4105/nico-tag-map/blob/main/img_tag_fairy.png?raw=true" alt="">
    </div>
    <div id="status"></div>
    <div id="statusExtra"></div>
    <div id="statusErrorHelp"></div>
  </div>

  <div id="graphWrap">
    <svg id="graph" viewBox="0 0 1000 700"></svg>
    <div id="graphLoadingOverlay"></div>
    <div id="zoomControls">
      <button id="zoomInBtn">＋</button>
      <button id="zoomOutBtn">－</button>
    </div>
  </div>

  <div id="afterStatusSection">
    <p id="legendClickInfo"></p>
    <p id="legendHoverInfo"></p>
  </div>
</div>

<div id="s31" class="gridSection">
  <h2 id="allTagsSummary">取得された関連タグ</h2>
  <div id="randomTagsSection">
    <span id="randomTagsTitle"></span>
    <div id="randomTagsList"></div>
    <button id="reshuffleRandomTagsBtn" class="secondaryBtn"></button>
  </div>
  <div id="allTagsControls">
    <span id="allTagsNewWindowNote"></span>
    <button id="openAllTagsWindowBtn" class="secondaryBtn"></button>
  </div>
</div>

<div id="s32" class="gridSection">
  <h2 id="tagHistoryTitle">探索したタグの記録</h2>
  <div id="tagHistorySection" class="infoBox">
    <ul id="tagHistoryList"></ul>
  </div>
</div>

<div id="s41" class="gridSection">
  <h2 id="shareSectionTitle">発見したタグを共有する</h2>
  <p id="shareDescription1" class="sectionDescription"></p>
  <p id="shareDescription2" class="sectionDescription"></p>
  <button id="shareTagBtn" class="secondaryBtn"></button>
</div>

<div id="s42" class="gridSection">
  <h2 id="fairyPromoTitle">タグで見つけたいい場所、ランダムで歩いてみる？</h2>
  <p id="fairyPromoDescription" class="sectionDescription"></p>
  <a id="fairyPromoLink" href="https://hitoiki4105.github.io/nico-fairy-player/" target="_blank" rel="noopener">
    <img id="fairyPromoImage" src="https://github.com/hitoiki4105/nico-fairy-player/blob/main/img_title.jpg?raw=true" alt="妖精さんプレイヤー">
  </a>
</div>

</div>

<button id="backToTopBtn">↑</button>

<script src="script.js"></script>
</body>
</html>
